<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="A run: the stages done once, the loop of loadings until equilibrium, and the end">
<title>A run: the stages done once, the loop of loadings until equilibrium, and the end</title>
<rect width="960" height="470" fill="#fbfcfd"/>
<defs>
</defs>
