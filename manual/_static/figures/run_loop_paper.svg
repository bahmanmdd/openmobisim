<rect x="330" y="40" width="410" height="380" rx="12" fill="#fae8e7" stroke="#ffa39f" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="350" y="60" width="350" height="66" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="525" y="80" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">route_choice · itinerary_choice</text>
<text x="525" y="98.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">each choosing trip picks a route, an itinerary or a mode</text>
<text x="525" y="111.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">(core-choice)</text>
<rect x="350" y="150" width="350" height="66" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="525" y="170" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">loading</text>
<text x="525" y="188.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">every vehicle through the network over the window: cars,</text>
<text x="525" y="201.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">buses, park-and-ride cars (core-loading)</text>
<rect x="350" y="240" width="350" height="66" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="525" y="260" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">route_update</text>
<text x="525" y="278.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">new routes found on the new link times join the route sets</text>
<text x="525" y="291.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">(core-routes)</text>
<rect x="350" y="330" width="350" height="66" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="525" y="350" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">network_gap</text>
<text x="525" y="368.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">how far from equilibrium; who chooses again next time</text>
<text x="525" y="381.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">(core-sim)</text>
