<text x="155" y="68" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">static_routes</text>
<text x="155" y="88.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">bike and walk trips routed on their</text>
<text x="155" y="101.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">layers</text>
<text x="155" y="136" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#55657a">core-routes on core-graph's layers</text>
<rect x="20" y="166" width="270" height="100" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="155" y="188" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">itineraries_setup</text>
<text x="155" y="208.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">candidate chains of legs for transit,</text>
<text x="155" y="221.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">park-and-ride, bike-and-ride and</text>
<text x="155" y="235.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">mode-choosing trips</text>
<text x="155" y="256" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#55657a">core-sim with core-transit (RAPTOR)</text>
<rect x="20" y="286" width="270" height="100" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="155" y="308" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a1626">route_sets</text>
<text x="155" y="328.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">a set of car routes for every</text>
<text x="155" y="341.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">origin–destination pair</text>
<text x="155" y="376" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#55657a">core-routes</text>
