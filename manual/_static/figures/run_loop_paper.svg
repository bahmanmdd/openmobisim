<path d="M 525 218 L 525 238" fill="none" stroke="#ce2739" stroke-width="1.6" marker-end="url(#mce2739)"/>
<path d="M 525 308 L 525 328" fill="none" stroke="#ce2739" stroke-width="1.6" marker-end="url(#mce2739)"/>
<path d="M 700 363 L 718 363 L 718 93 L 702 93" fill="none" stroke="#ce2739" stroke-width="1.6" marker-end="url(#mce2739)"/>
<text x="731" y="228" font-size="10" fill="#ce2739" text-anchor="middle" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" transform="rotate(-90 731 228)">again</text>
<text x="535" y="438" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#55657a">iteration 0 is everyone's first choice; after it, each traveller chooses again with probability 1/(i+1) (msa)</text>
<rect x="770" y="46" width="175" height="100" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="857" y="66" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#0a1626">disrupted_loading</text>
<text x="857" y="84.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">once more with the</text>
<text x="857" y="97.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">disruptions travellers did</text>
<text x="857" y="111.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">not know of, every choice</text>
<text x="857" y="124.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">as the run left it</text>
<text x="857" y="138.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">(optional)</text>
<rect x="770" y="186" width="175" height="90" rx="7" fill="#e0f0f8" stroke="#67cdfe" stroke-width="1.2"/>
<text x="857" y="206" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#0a1626">results_assembled</text>
<text x="857" y="224.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">the Run: tables, the</text>
<text x="857" y="237.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">convergence report, timings;</text>
<text x="857" y="251.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">the output files</text>
<path d="M 857 148 L 857 184" fill="none" stroke="#9aa8b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m9aa8b8)"/>
<path d="M 740 231 L 768 231" fill="none" stroke="#9aa8b8" stroke-width="1.4" marker-end="url(#m9aa8b8)"/>
<text x="857" y="306" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#55657a">stops when the gap is under its</text>
<text x="857" y="320" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#55657a">tolerance, or at the iteration limit</text>
<text x="480" y="462" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#55657a">The stage names are the ones timings.csv and Run.timings() record, with the wall-clock time each took.</text>
</svg>
