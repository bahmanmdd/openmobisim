<text x="480" y="300" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">Teal: new at this iteration, added at the end of the set. A bike or walk route and the transit journeys do not depend on road traffic,</text>
<text x="480" y="316" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">so later searches find only car routes. A car route is added only while its origin-destination pair holds fewer than max_car_routes.</text>
