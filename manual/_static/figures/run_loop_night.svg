<text x="20" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#93a2b6" letter-spacing="1.2">ONCE</text>
<text x="215" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#93a2b6" letter-spacing="1.2">EACH ITERATION K = 0, 1, 2, ...</text>
<text x="820" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#93a2b6" letter-spacing="1.2">AT THE END</text>
<rect x="20" y="40" width="160" height="76" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="100.0" y="67.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">Build</text>
<text x="100.0" y="82.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the network, the timetable,</text>
<text x="100.0" y="97.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the trips linked to both</text>
<rect x="20" y="150" width="160" height="76" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="100.0" y="169.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">Start</text>
<text x="100.0" y="184.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">link times at free flow,</text>
<text x="100.0" y="199.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">transit on its timetable:</text>
<text x="100.0" y="214.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the costs of iteration 0</text>
<path d="M 100 116 L 100 148" fill="none" stroke="#5f7897" stroke-width="1.6" marker-end="url(#m5f7897)"/>
<rect x="205" y="40" width="590" height="310" rx="10" fill="#0d2a3d" stroke="#057da9" stroke-width="1.2"/>
<rect x="225" y="60" width="165" height="90" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="307.5" y="86.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">1  Search</text>
<text x="307.5" y="101.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the best alternative per mode</text>
<text x="307.5" y="116.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">at the current times,</text>
<text x="307.5" y="131.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">added to the traveller's set if new</text>
<rect x="420" y="60" width="165" height="90" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="502.5" y="86.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">2  Choose</text>
<text x="502.5" y="101.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">travellers offered a new choice</text>
<text x="502.5" y="116.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">take the choice model's choice</text>
<text x="502.5" y="131.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">over their whole set</text>
<rect x="615" y="60" width="165" height="90" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="697.5" y="86.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">3  Load</text>
<text x="697.5" y="101.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">cars on the point queue,</text>
<text x="697.5" y="116.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">bikes and walkers at free flow,</text>
<text x="697.5" y="131.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">transit as scheduled</text>
<rect x="615" y="200" width="165" height="90" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="697.5" y="226.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">4  Measure</text>
<text x="697.5" y="241.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">every taken alternative re-costed</text>
<text x="697.5" y="256.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">at the loaded times;</text>
<text x="697.5" y="271.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">link times rewritten</text>
<rect x="420" y="200" width="165" height="90" rx="7" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="502.5" y="226.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">5  Assess</text>
<text x="502.5" y="241.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the switch and found shares,</text>
<text x="502.5" y="256.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the unfinished trips, the gap or</text>
<text x="502.5" y="271.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the share who would change</text>
<path d="M 390 105 L 418 105" fill="none" stroke="#67cdfe" stroke-width="2" marker-end="url(#m67cdfe)"/>
<path d="M 585 105 L 613 105" fill="none" stroke="#67cdfe" stroke-width="2" marker-end="url(#m67cdfe)"/>
<path d="M 697 150 L 697 198" fill="none" stroke="#67cdfe" stroke-width="2" marker-end="url(#m67cdfe)"/>
<path d="M 615 245 L 587 245" fill="none" stroke="#67cdfe" stroke-width="2" marker-end="url(#m67cdfe)"/>
<rect x="225" y="200" width="165" height="90" rx="7" fill="#2b2110" stroke="#7a5a1c" stroke-width="1.2"/>
<text x="307.5" y="226.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">Stop?</text>
<text x="307.5" y="241.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the mean trip time steady over</text>
<text x="307.5" y="256.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">five iterations and few trips</text>
<text x="307.5" y="271.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">found something better; or the cap</text>
<path d="M 420 245 L 392 245" fill="none" stroke="#67cdfe" stroke-width="2" marker-end="url(#m67cdfe)"/>
<path d="M 307 200 L 307 152" fill="none" stroke="#67cdfe" stroke-width="2" marker-end="url(#m67cdfe)"/>
<text x="315" y="180" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#93a2b6">no: k + 1</text>
<text x="500" y="322" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#93a2b6">link times and costs of iteration k feed the search and the choice of iteration k + 1</text>
<path d="M 180 188 L 205 188 L 205 105 L 223 105" fill="none" stroke="#5f7897" stroke-width="1.6" marker-end="url(#m5f7897)"/>
<rect x="820" y="200" width="120" height="90" rx="7" fill="#0e2a2b" stroke="#1f6e6a" stroke-width="1.2"/>
<text x="880.0" y="226.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#f2f6fa">Write</text>
<text x="880.0" y="241.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">the four tables</text>
<text x="880.0" y="256.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">and the record</text>
<text x="880.0" y="271.5" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">from the last iteration</text>
<path d="M 307 290 L 307 372 L 880 372 L 880 292" fill="none" stroke="#40c8c1" stroke-width="2" marker-end="url(#m40c8c1)"/>
<text x="600" y="388" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#93a2b6">yes</text>
