<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="A trip end: the door joined by a straight walk to its nearest node of each mode, and to a stop by that walk, the walk links and a last straight walk">
<title>A trip end: the door joined by a straight walk to its nearest node of each mode, and to a stop by that walk, the walk links and a last straight walk</title>
<rect width="960" height="330" fill="#fbfcfd"/>

<text x="20" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#55657a" letter-spacing="1.2">A TRIP END: FROM THE DOOR TO THE NETWORK, PER MODE, AND TO THE STOPS IN REACH</text>
<path d="M 60 90 L 580 60" fill="none" stroke="#057da9" stroke-width="3"/>
<text x="586" y="64" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#3d4c5f">a street: car, bike and walk links</text>
<path d="M 60 282 L 580 252" fill="none" stroke="#04938e" stroke-width="3"/>
<text x="586" y="256" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#3d4c5f">a cycle path: bike and walk links</text>
<path d="M 250 271 L 470 258.3" fill="none" stroke="#b26a00" stroke-width="7"/>
<path d="M 300 180 L 270 78" fill="none" stroke="#057da9" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="270" cy="78" r="5" fill="#057da9"/>
<text x="280" y="68" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">car node</text>
<path d="M 300 180 L 330 266.4" fill="none" stroke="#04938e" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="330" cy="266.4" r="5" fill="#04938e"/>
<text x="340" y="256.4" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">bike node</text>
<path d="M 300 180 L 250 271" fill="none" stroke="#b26a00" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="250" cy="271" r="5" fill="#b26a00"/>
<text x="242" y="291" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="end" fill="#0a1626">walk node</text>
<rect x="463" y="224.3" width="14" height="14" rx="3" fill="#fbf1de" stroke="#b26a00" stroke-width="1.6"/>
<path d="M 470 258.3 L 470 238.3" fill="none" stroke="#b26a00" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="482" y="236.3" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">a stop in reach</text>
<text x="410" y="292" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">the walk to the stop, along walk links</text>
<circle cx="300" cy="180" r="7" fill="#0a1626"/>
<text x="312" y="174" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0a1626">door</text>
<rect x="640" y="96" width="300" height="60" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="790.0" y="115.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0a1626">The gap of a trip end</text>
<text x="790.0" y="130.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">a straight walk from the door to the nearest node</text>
<text x="790.0" y="145.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">of the mode, at the walk speed, in every mode</text>
<rect x="640" y="170" width="300" height="60" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="790.0" y="189.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0a1626">The access and egress lists</text>
<text x="790.0" y="204.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">the stops within stop_walk_max of each end,</text>
<text x="790.0" y="219.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">each with its walking seconds</text>
<text x="480" y="318" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">Dashed: walked in a straight line. Every walk is part of the trip's door-to-door time and of its cost.</text>
</svg>
