<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="A trip end: the door joined by a straight walk to its nearest node of each mode, and to the stops within walking reach">
<title>A trip end: the door joined by a straight walk to its nearest node of each mode, and to the stops within walking reach</title>
<rect width="960" height="330" fill="#fbfcfd"/>

<text x="20" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#55657a" letter-spacing="1.2">A TRIP END: FROM THE DOOR TO THE NETWORK, PER MODE, AND TO THE STOPS IN REACH</text>
<circle cx="300" cy="190" r="130" fill="none" stroke="#c5cfda" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="300" y="338" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">stops are searched within stop_walk_max of the door</text>
<path d="M 60 90 L 560 60" fill="none" stroke="#057da9" stroke-width="3"/>
<text x="566" y="64" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#3d4c5f">a street: car, bike and walk links</text>
<path d="M 80 290 L 520 250" fill="none" stroke="#04938e" stroke-width="3"/>
<text x="526" y="254" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#3d4c5f">a cycle path: bike and walk links</text>
<path d="M 300 190 L 250 79" fill="none" stroke="#057da9" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="250" cy="79" r="5" fill="#057da9"/>
<text x="260" y="70" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">car node</text>
<path d="M 300 190 L 360 264" fill="none" stroke="#04938e" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="360" cy="264" r="5" fill="#04938e"/>
<text x="370" y="282" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">bike node</text>
<path d="M 300 190 L 200 279" fill="none" stroke="#b26a00" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="200" cy="279" r="5" fill="#b26a00"/>
<text x="210" y="297" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">walk node</text>
<rect x="378" y="113" width="14" height="14" rx="3" fill="#fbf1de" stroke="#b26a00" stroke-width="1.6"/>
<path d="M 300 190 L 385 120" fill="none" stroke="#b26a00" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="208" y="143" width="14" height="14" rx="3" fill="#fbf1de" stroke="#b26a00" stroke-width="1.6"/>
<path d="M 300 190 L 215 150" fill="none" stroke="#b26a00" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="397" y="116" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#0a1626">stop</text>
<text x="203" y="140" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="end" fill="#0a1626">stop</text>
<circle cx="300" cy="190" r="7" fill="#0a1626"/>
<text x="312" y="194" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0a1626">door</text>
<rect x="640" y="96" width="300" height="60" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="790.0" y="115.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0a1626">The gap</text>
<text x="790.0" y="130.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">a straight walk from the door to the nearest node</text>
<text x="790.0" y="145.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">of the mode, at the walk speed, in every mode</text>
<rect x="640" y="170" width="300" height="60" rx="7" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<text x="790.0" y="189.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0a1626">The access and egress lists</text>
<text x="790.0" y="204.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">the stops in walking reach of each end,</text>
<text x="790.0" y="219.0" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">each with its walking seconds</text>
<text x="790" y="296" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">Dashed: walked. The gap and the walk to a stop are part of</text>
<text x="790" y="312" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">the trip's door-to-door time and of its cost.</text>
</svg>
