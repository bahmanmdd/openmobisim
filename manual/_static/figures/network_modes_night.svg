<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="One network, modes per link: a street as a car link, a bike link and a walk link between the same two nodes, and a cycle path that only bikes and walkers have">
<title>One network, modes per link: a street as a car link, a bike link and a walk link between the same two nodes, and a cycle path that only bikes and walkers have</title>
<rect width="960" height="300" fill="#0a1220"/>
<marker id="m40c8c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40c8c1"/></marker><marker id="m67cdfe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67cdfe"/></marker><marker id="mf0b95a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b95a"/></marker>
<text x="20" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#93a2b6" letter-spacing="1.2">ONE NETWORK, MODES PER LINK: EACH LINK RUNS FROM ITS UPSTREAM END TO ITS DOWNSTREAM END</text>
<text x="120" y="212" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#93a2b6">node A</text>
<text x="520" y="212" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#93a2b6">node B</text>
<text x="860" y="212" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#93a2b6">node C</text>
<path d="M 130 122 L 508 122" fill="none" stroke="#67cdfe" stroke-width="3" marker-end="url(#m67cdfe)"/>
<text x="320.0" y="88" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#f2f6fa">car link: length, lanes, free-flow speed, capacity</text>
<text x="320.0" y="104" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">free-flow time = length / speed; cars queue at the downstream end</text>
<path d="M 130 150 L 508 150" fill="none" stroke="#40c8c1" stroke-width="3" marker-end="url(#m40c8c1)"/>
<text x="320.0" y="166" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">bike link: length; time = length / bike speed</text>
<path d="M 130 178 L 508 178" fill="none" stroke="#f0b95a" stroke-width="3" marker-end="url(#mf0b95a)"/>
<text x="320.0" y="194" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">walk link: length; time = length / walk speed</text>
<path d="M 530 142 L 848 142" fill="none" stroke="#40c8c1" stroke-width="3" marker-end="url(#m40c8c1)"/>
<path d="M 530 170 L 848 170" fill="none" stroke="#f0b95a" stroke-width="3" marker-end="url(#mf0b95a)"/>
<text x="690.0" y="126" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">a cycle path: a bike link and a walk link,</text>
<text x="690.0" y="190" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#cdd6e1">no car link, so no car route passes here</text>
<rect x="111" y="110" width="18" height="80" rx="9" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<rect x="511" y="110" width="18" height="80" rx="9" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<rect x="851" y="110" width="18" height="80" rx="9" fill="#131d30" stroke="#364966" stroke-width="1.2"/>
<text x="480" y="262" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#93a2b6">Blue: car. Teal: bike. Amber: walk. The opposite direction of a street is another link, from B to A.</text>
<text x="480" y="280" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#93a2b6">A link table may also give several modes to one link (car;bike); a network read from OpenStreetMap has one mode per link.</text>
</svg>
