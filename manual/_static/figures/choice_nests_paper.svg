<text x="70" y="56" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#55657a">1: a nest, by the nests' expected costs</text>
<text x="480" y="296" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">2: an alternative within the nest, by its cost; a car route's cost is corrected by its path size, which is lower the more of the</text>
<text x="480" y="312" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">route other car routes of the set share. The nest scale says how much more alike two alternatives of one mode are than two of different modes.</text>
