<text x="100" y="302" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#93a2b6">Blue: timed by the loading (cars) or the timetable (rides). Teal: at a fixed speed. Amber: waiting, part of the trip's time.</text>
<text x="100" y="318" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#93a2b6">Grey: a walk off the network (a door to its node or stop) or along a footpath between two stops, at the walk speed.</text>
