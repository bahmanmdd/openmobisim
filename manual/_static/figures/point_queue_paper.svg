<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="A link as a point queue: cars cross it in its free-flow time and leave its downstream end no closer than one headway apart; the delay and the queue read from cumulative arrivals and departures">
<title>A link as a point queue: cars cross it in its free-flow time and leave its downstream end no closer than one headway apart; the delay and the queue read from cumulative arrivals and departures</title>
<rect width="960" height="330" fill="#fbfcfd"/>
<marker id="m057da9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#057da9"/></marker><marker id="m9aa8b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8b8"/></marker>
<text x="20" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#55657a" letter-spacing="1.2">ONE LINK: FREE-FLOW TRAVEL, THEN A GATE AT THE DOWNSTREAM END</text>
<text x="520" y="24" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#55657a" letter-spacing="1.2">AT THE GATE: CUMULATIVE COUNTS</text>
<rect x="30" y="110" width="380" height="60" rx="6" fill="#f1f4f8" stroke="#c5cfda" stroke-width="1.2"/>
<rect x="404" y="100" width="10" height="80" rx="3" fill="#b26a00"/>
<circle cx="70" cy="140" r="7" fill="#057da9"/>
<circle cx="150" cy="140" r="7" fill="#057da9"/>
<circle cx="250" cy="140" r="7" fill="#057da9"/>
<circle cx="392" cy="140" r="7" fill="#057da9"/>
<circle cx="376" cy="140" r="7" fill="#057da9"/>
<circle cx="360" cy="140" r="7" fill="#057da9"/>
<circle cx="344" cy="140" r="7" fill="#057da9"/>
<path d="M 426 140 L 470 140" fill="none" stroke="#057da9" stroke-width="2" marker-end="url(#m057da9)"/>
<path d="M 40 90 L 396 90" fill="none" stroke="#9aa8b8" stroke-width="1.6" marker-end="url(#m9aa8b8)"/>
<text x="218" y="80" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0a1626">free-flow time = length / free-flow speed</text>
<text x="409" y="200" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">the gate: at most one car per</text>
<text x="409" y="215" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3d4c5f">headway = 3 600 s / capacity (veh/h)</text>
<text x="130" y="200" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">upstream end</text>
<text x="352" y="98" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#3d4c5f"></text>
<text x="218" y="262" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">A car that enters at time t leaves at the later of t + free-flow time</text>
<text x="218" y="278" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#55657a">and one headway after the car ahead of it. The queue takes no road space.</text>
<path d="M 560 270 L 910 270" fill="none" stroke="#9aa8b8" stroke-width="1.6" marker-end="url(#m9aa8b8)"/>
<path d="M 560 270 L 560 50" fill="none" stroke="#9aa8b8" stroke-width="1.6" marker-end="url(#m9aa8b8)"/>
<text x="910" y="288" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#55657a">time</text>
<text x="552" y="62" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#55657a">cars</text>
<path d="M 560 270 L 620 240" fill="none" stroke="#057da9" stroke-width="2.2"/>
<path d="M 620 240 L 760 80" fill="none" stroke="#057da9" stroke-width="2.2"/>
<path d="M 760 80 L 880 65" fill="none" stroke="#057da9" stroke-width="2.2"/>
<path d="M 560 270 L 620 240" fill="none" stroke="#04938e" stroke-width="2.2"/>
<path d="M 620 240 L 880 65" fill="none" stroke="#04938e" stroke-width="2.2"/>
<text x="656" y="170" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="end" fill="#057da9">arrivals at the gate</text>
<text x="796" y="174" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#04938e">departures, at capacity</text>
<path d="M 710 137 L 773 137" fill="none" stroke="#b26a00" stroke-width="1.6"/>
<text x="782" y="141" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#3d4c5f">delay of a car</text>
<path d="M 740 103 L 740 159" fill="none" stroke="#b26a00" stroke-width="1.6"/>
<text x="732" y="94" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#3d4c5f">cars in the queue</text>
</svg>
