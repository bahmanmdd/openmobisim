[package]
name = "openmobisim-core-assignment"
description = "The iterated dynamic traffic assignment for openmobisim: chains of legs, one choice set per trip, five stages per assignment iteration (search, choose, load, measure, assess)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The stages' work on every logical core. Results are identical either way: the work is split
# into fixed chunks and joined in order, and every random draw is addressed by identity.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
openmobisim-core-types = { workspace = true }
openmobisim-core-graph = { workspace = true }
openmobisim-core-demand = { workspace = true }
openmobisim-core-loading = { workspace = true }
openmobisim-core-routes = { workspace = true }
openmobisim-core-choice = { workspace = true }
openmobisim-core-transit = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
# Runs at other thread counts, to check they agree.
rayon = { workspace = true }
