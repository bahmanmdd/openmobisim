[package]
name = "openmobisim-core-sim"
description = "The Run for openmobisim: orchestration, the event queue in seconds (S88), one KPI, trip completion statistics (S57)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Route transit passengers in parallel. Results are identical either way: trips are
# split into fixed chunks and the chunks joined in order.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
openmobisim-core-types = { workspace = true }
openmobisim-core-graph = { workspace = true }
openmobisim-core-demand = { workspace = true }
openmobisim-core-loading = { workspace = true }
openmobisim-core-routes = { workspace = true }
openmobisim-core-choice = { workspace = true }
openmobisim-core-transit = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# Runs of one scenario at other thread counts, to check they agree.
rayon = { workspace = true }
