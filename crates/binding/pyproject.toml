# The Python package `openmobisim`: the extension module of this crate, built by maturin. No Python
# runtime dependency.
[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "openmobisim"
description = "Multimodal dynamic traffic assignment: cars, bikes, walkers and transit."
requires-python = ">=3.11"
license = "Apache-2.0"
dynamic = ["version"]
