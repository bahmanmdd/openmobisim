# Temporary measurement, removed before the pull request: the package used by an account without
# administrator rights on Windows, Linux and macOS. Every experimental step prints its results and
# never fails the run.

name: Standard user (temporary)

on:
  push:
    branches: [windows-standard-user]

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows, a standard user
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-windows-x64
          path: dist
          run-id: 45022654803
          github-token: ${{ github.token }}
      - name: Install the wheel and the test dependencies
        shell: bash
        run: |
          python -m pip install pytest==9.2.0 pyarrow==26.0.1 networkx==3.7
          python -m pip install --no-index --find-links dist openmobisim
      - name: As the runner's account (an administrator) - the suite, the symbolic-link cases, Chrome
        continue-on-error: true
        shell: pwsh
        run: |
          whoami
          whoami /groups | Select-String -Pattern 'Administrators|Mandatory Label'
          New-Item -ItemType Directory -Force D:\oms-admin | Out-Null
          python .github/standard-user/measure.py $env:GITHUB_WORKSPACE D:\oms-admin none suite f1 f2 chrome
          exit 0
      - name: A standard user, a share and its folders, made by the administrator
        continue-on-error: true
        shell: pwsh
        run: |
          $user = 'omsuser'
          $pw = 'Aa1!' + [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$pw"
          "OMS_PW=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          net user $user $pw /add /expires:never
          net user $user | Select-String 'Group'
          "-- members of Administrators:"
          Get-LocalGroupMember Administrators | Format-Table -AutoSize | Out-String
          New-Item -ItemType Directory -Force D:\oms-user | Out-Null
          icacls D:\oms-user /grant "${user}:(OI)(CI)F" /Q
          icacls D:\oms-user /setowner $user /Q
          icacls D:\oms-user
          "-- the checkout before: "; icacls $env:GITHUB_WORKSPACE
          $t = Get-Date
          icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)RX" /C /Q
          icacls $env:pythonLocation /grant "${user}:(OI)(CI)RX" /C /Q
          "read access granted in $([int]((Get-Date) - $t).TotalSeconds) s"
          New-Item -ItemType Directory -Force D:\oms-share | Out-Null
          icacls D:\oms-share /grant "${user}:(OI)(CI)F" /Q
          Get-Service LanmanServer | Format-Table -AutoSize | Out-String
          New-SmbShare -Name omsshare -Path D:\oms-share -FullAccess Everyone | Format-List Name, Path | Out-String
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -ErrorAction SilentlyContinue | Format-List | Out-String
          exit 0
      - name: Start-Process -Credential as the standard user (does it start a process?)
        continue-on-error: true
        shell: pwsh
        run: |
          $cred = New-Object System.Management.Automation.PSCredential('omsuser', (ConvertTo-SecureString $env:OMS_PW -AsPlainText -Force))
          try {
            $p = Start-Process -FilePath whoami.exe -ArgumentList '/groups' -Credential $cred -WorkingDirectory D:\oms-user `
              -RedirectStandardOutput D:\oms-user\sp-out.txt -RedirectStandardError D:\oms-user\sp-err.txt -Wait -PassThru -LoadUserProfile -ErrorAction Stop
            "Start-Process -Credential: exit $($p.ExitCode)"
            Get-Content D:\oms-user\sp-out.txt, D:\oms-user\sp-err.txt
          } catch { "Start-Process -Credential: $_" }
          exit 0
      - name: As the standard user, through a scheduled task - (a) the suite, (b) to (e) the cases
        continue-on-error: true
        shell: pwsh
        run: |
          $user = 'omsuser'
          $py = (Get-Command python).Source
          $cmd = 'D:\oms-user\run.cmd'
          @"
          @echo off
          set PYTHONDONTWRITEBYTECODE=1
          cd /d D:\oms-user
          "$py" "$env:GITHUB_WORKSPACE\.github\standard-user\measure.py" "$env:GITHUB_WORKSPACE" D:\oms-user \\localhost\omsshare who suite b c1 c2 d1 d2 d3 e1 e2 symlink chrome > D:\oms-user\out.txt 2>&1
          echo %ERRORLEVEL% > D:\oms-user\done.txt
          "@ | Set-Content -Encoding ascii $cmd
          Get-Content $cmd
          function Run-Task {
            Remove-Item D:\oms-user\done.txt, D:\oms-user\out.txt -ErrorAction SilentlyContinue
            $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c $cmd"
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 40)
            Unregister-ScheduledTask -TaskName oms-standard-user -Confirm:$false -ErrorAction SilentlyContinue
            Register-ScheduledTask -TaskName oms-standard-user -Action $action -Settings $settings -User $user -Password $env:OMS_PW -RunLevel Limited | Out-Null
            Start-ScheduledTask -TaskName oms-standard-user
            $deadline = (Get-Date).AddMinutes(40)
            do {
              Start-Sleep -Seconds 5
              $state = (Get-ScheduledTask -TaskName oms-standard-user).State
              $result = (Get-ScheduledTaskInfo -TaskName oms-standard-user).LastTaskResult
            } until ((Test-Path D:\oms-user\done.txt) -or ((Get-Date) -gt $deadline) -or ($state -eq 'Ready' -and $result -ne 267011 -and $result -ne 267009))
            Start-Sleep -Seconds 2
            Write-Host ("task state $state, last result $result (0x{0:x})" -f $result)
            return (Test-Path D:\oms-user\done.txt)
          }
          $t = Get-Date
          if (-not (Run-Task)) {
            "-- the task did not finish; granting the batch logon right and trying again"
            $sid = (New-Object System.Security.Principal.NTAccount($user)).Translate([System.Security.Principal.SecurityIdentifier]).Value
            secedit /export /cfg D:\sec.inf /areas USER_RIGHTS | Out-Null
            $inf = Get-Content D:\sec.inf
            if ($inf -match '^SeBatchLogonRight') { $inf = $inf -replace '^(SeBatchLogonRight = .*)$', "`$1,*$sid" }
            else { $inf = $inf -replace '^\[Privilege Rights\]$', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid" }
            Set-Content D:\sec.inf $inf -Encoding Unicode
            secedit /configure /db D:\sec.sdb /cfg D:\sec.inf /areas USER_RIGHTS
            Run-Task | Out-Null
          }
          "-- as the standard user, $([int]((Get-Date) - $t).TotalSeconds) s:"
          if (Test-Path D:\oms-user\out.txt) { Get-Content D:\oms-user\out.txt } else { "no output" }
          exit 0

  posix:
    name: ${{ matrix.os }}, a standard user
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: macos-latest
            artifact: wheel-macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
          run-id: 45022654803
          github-token: ${{ github.token }}
      - name: Install the wheel and the test dependencies
        run: |
          python -m pip install pytest==9.2.0 pyarrow==26.0.1 networkx==3.7
          python -m pip install --no-index --find-links dist openmobisim
      - name: The runner's account
        continue-on-error: true
        run: |
          id
          sudo -n true && echo "the runner's account may use sudo without a password"
          exit 0
      - name: A new user without administrator rights runs the binding's tests
        continue-on-error: true
        run: |
          PY=$(command -v python)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo useradd --create-home omsuser
            SRC=/srv/oms
          else
            sudo sysadminctl -addUser omsuser -password "Aa1-$(uuidgen)" 2>&1 | tail -2
            dseditgroup -o checkmember -m omsuser admin || true
            SRC=/Users/Shared/oms
          fi
          id omsuser
          sudo -u omsuser sudo -n true 2>&1 || echo "omsuser may not use sudo"
          sudo mkdir -p "$SRC"
          sudo cp -R crates PARAMETERS.md "$SRC/"
          sudo chmod -R a+rX "$SRC"
          d=$(dirname "$PY"); while [ "$d" != / ]; do ls -ld "$d"; sudo chmod o+x "$d"; d=$(dirname "$d"); done
          start=$(date +%s)
          sudo -u omsuser env PYTHONDONTWRITEBYTECODE=1 HOME=/tmp/omsuser-home sh -c \
            "mkdir -p /tmp/omsuser-home && cd /tmp/omsuser-home && id && '$PY' -m pytest '$SRC/crates/binding/tests' -p no:cacheprovider -rsfE --tb=short --disable-warnings --basetemp /tmp/omsuser-home/pytest" \
            || echo "pytest exit $?"
          echo "as omsuser: $(( $(date +%s) - start )) s"
          exit 0
