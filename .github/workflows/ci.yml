# The gate: everything here is green before a change lands. One job on one runner, no artifacts; the steps are
# named so that a failure names its cause. The three-platform matrix and the wheel build return with the public tree.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint, test, budgets, guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy, warnings as errors (functions over 80 lines fail here)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Convergence tier (release; tests 4 and 6 at a large population to a fixed count)
        run: cargo test --release -p openmobisim-loop --test braess --test sioux_falls -- --ignored
      - name: Car against bike behind a bottleneck, one run; Braess's 19-minute case and Nguyen-Dupuis's steady hour over 5 seeds; Nguyen-Dupuis's queued links over 20 seeds (release only)
        run: >-
          cargo test --release -p openmobisim-loop --test bottleneck_mode_choice --test braess --test nguyen_dupuis -- --ignored --exact
          one_run_follows_the_trajectory_and_reaches_the_steady_state_within_sampling_error
          with_the_added_link_every_trip_takes_19_min_split_in_thirds_with_8_min_queues
          the_steady_hour_is_the_capacity_constrained_equilibrium
          over_twenty_seeds_each_queued_link_enters_at_its_capacity_within_3_percent
      - name: Delft read in release (under 3 s; release only)
        run: cargo test --release -p openmobisim-io-osm --test delft -- --ignored --nocapture
      - name: Delft feed read in release, footpaths included (under 3 s; release only)
        run: cargo test --release -p openmobisim-io-gtfs --test delft -- --ignored --nocapture
      - name: The hand run's Parquet files read by pyarrow 26.0.1 against the hand numbers
        run: |
          python3 -m venv "$RUNNER_TEMP/pyarrow"
          "$RUNNER_TEMP/pyarrow/bin/pip" install --quiet pyarrow==26.0.1
          "$RUNNER_TEMP/pyarrow/bin/python" crates/io-parquet/tests/read_back.py target/tmp/io-parquet-hand-run
      - name: Sioux Falls's run written in release (under 1 s)
        run: cargo test --release -p openmobisim-io-parquet --test sioux_falls -- --ignored --nocapture
      - name: The Python binding built in release by maturin, its tests by pytest (pyarrow 26.0.1, networkx 3.7)
        run: |
          python3 -m venv "$RUNNER_TEMP/binding"
          "$RUNNER_TEMP/binding/bin/pip" install --quiet maturin==1.16.0 pytest==9.2.0 pyarrow==26.0.1 networkx==3.7
          VIRTUAL_ENV="$RUNNER_TEMP/binding" "$RUNNER_TEMP/binding/bin/maturin" develop --release -m crates/binding/Cargo.toml
          "$RUNNER_TEMP/binding/bin/python" -m pytest crates/binding/tests -s -p no:cacheprovider
      - name: Budgets
        run: bash tools/check_limits.sh
      - name: Leak guard, built-in rules
        run: bash tools/guard.sh tree .
