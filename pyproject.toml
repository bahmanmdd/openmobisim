[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "openmobisim"
description = "An agent-based multimodal mobility simulator for infrastructure planning and optimisation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The openmobisim authors" }]
keywords = ["mobility", "simulation", "transport", "traffic", "multimodal", "optimisation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# The runtime dependency list is numpy and nothing else, on purpose: every
# addition is something a user has to install to run a simulation, and the
# promise is `pip install openmobisim` with no compiler and no conda-only path.
dependencies = ["numpy>=2.3"]

# Version comes from Cargo.toml, so there is one place to bump it.
dynamic = ["version"]

[project.scripts]
openmobisim = "openmobisim.__main__:main"

[project.urls]
Repository = "https://github.com/bahmanmdd/openmobisim"

[project.optional-dependencies]
# Minimum versions (S247): the Scientific Python ecosystem's dated support policy
# (SPEC 0) for the release, 2026-Q4 — versions released in the last two years —
# tested in CI by the `python-minimum` job. Python itself stays at 3.11: the wheel
# is abi3 and the core Rust, so older interpreters cost nothing. The exact versions
# the notebooks and reference results were made with: requirements/notebooks.txt.
# The notebook stack is an extra, not a dependency: a user running openmobisim
# inside an optimisation loop should not be made to install Jupyter.
notebooks = [
    "jupyterlab>=4.3",
    "matplotlib>=3.11",
    "pandas>=2.3",
    "polars>=1.20",
    "pyarrow>=19.0",
]
# Figures (`openmobisim.viz`). An extra, not a dependency: a run inside an
# optimisation loop should not pull in a plotting library.
viz = ["matplotlib>=3.11"]
dev = [
    "maturin>=1.9,<2.0",
    "matplotlib>=3.11",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[tool.maturin]
manifest-path = "crates/py-bindings/Cargo.toml"
module-name = "openmobisim._core"
python-source = "python"
strip = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; a docstring repeating it is noise. The
# module docstring still explains what the file is defending.
"python/tests/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
